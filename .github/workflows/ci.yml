name: CI

on:
  push:
    # Runs CI checks on every push across all branches (feature branches, beta, main)
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - beta

jobs:
  verify:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run Next.js Build
        run: npm run build
        env:
          MONGODB_URI: "mongodb://127.0.0.1:27017/ci_test"
